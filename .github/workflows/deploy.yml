name: Deploy Hanyu Learning V2 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund
          fi

      - name: Validate Hanyu V2 release data
        run: node scripts/release-check.mjs

      - name: Validate PWA/Vite
        run: node scripts/verify-pwa.mjs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build for repository Pages
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Building with Vite base /$REPO_NAME/"
          npm run build -- --base "/$REPO_NAME/"

      - name: Validate dist
        run: node scripts/dist-check.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
